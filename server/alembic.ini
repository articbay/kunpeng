[alembic]
script_location = migrations
version_locations = %(here)s/migrations/versions_v3
path_separator = os
sourceless = false
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
sqlalchemy.url = mysql+pymysql://REPLACE_ME:REPLACE_ME@localhost:3306/kunpeng_demo

[post_write_hooks]
